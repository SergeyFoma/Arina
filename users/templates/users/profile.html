{% extends "base.html" %}

{% block header %}
    <a href="{% url 'users:logout_user' %}">Exit</a>
    <a href="{% url 'admin:index' %}"target='_blank'>admin</a>
    <a href="{% url 'users:change_password' %}">Сменить пароль</a>
{% endblock %}

{% block sidebar %}
<form action=""method='post'enctype='multipart/form-data'>
    {%csrf_token%}
   
    {% if prof.image %}
        <img src="{{prof.image.url}}" alt="avatar"width='150px'height='150px'>
    {% else %}
        <h2>Нет аватарки</h2>
    {% endif %}
        
   
    {%for f in form%}
        <p>{{f.label_tag}}</p>
        <p>{{f}}</p>
    {%endfor%}

    {{form_image}}

    <button type='submit'>Обновить профиль</button>
</form>
{% endblock %}
