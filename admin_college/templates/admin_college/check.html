{% extends "base.html" %} 

{% block sidebar %}
    Введите верификационный номер
    <form action=""method='post'>
        {% csrf_token %}
        <input type="text"name='check'id='number'value=''>
        <button type='submit'>Check</button>
    </form>
{% if messages %}
<ul class="messages">
    {% for message in messages %}
    <li{% if message.tags %} class="{{ message.tags }}"{% endif %}>{{ message }}</li>
    {% endfor %}
</ul>
{% endif %}
    
{% endblock %}
